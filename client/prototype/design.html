<style>
  /* ---- Tokens: docs/design.md §2–5 (become Tailwind 4 @theme in Phase 28) ---- */
  :root {
    --color-bg: #F8FAFC;
    --color-surface: #FFFFFF;
    --color-surface-muted: #F1F5F9;
    --color-border: #E2E8F0;
    --color-border-strong: #7C8798;
    --color-text: #0F172A;
    --color-text-muted: #475569;
    --color-primary: #4338CA;
    --color-primary-hover: #3730A3;
    --color-on-primary: #FFFFFF;
    --color-primary-soft: #EEF2FF;
    --color-success: #047857;
    --color-success-soft: #ECFDF5;
    --color-warning: #B45309;
    --color-warning-soft: #FFFBEB;
    --color-error: #B91C1C;
    --color-error-soft: #FEF2F2;
    --color-backdrop: rgb(15 23 42 / 0.5);

    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --radius-full: 9999px;

    --font-fa: "Vazirmatn", "Inter", system-ui, sans-serif;
    --font-en: "Inter", "Vazirmatn", system-ui, sans-serif;
    color-scheme: light;
  }
  :root.dark-mode {
    --color-bg: #0B1120;
    --color-surface: #131C2E;
    --color-surface-muted: #1E293B;
    --color-border: #273449;
    --color-border-strong: #64748B;
    --color-text: #F1F5F9;
    --color-text-muted: #A0AEC0;
    --color-primary: #818CF8;
    --color-primary-hover: #A5B4FC;
    --color-on-primary: #0B1120;
    --color-primary-soft: #1E1B4B;
    --color-success: #34D399;
    --color-success-soft: #052E25;
    --color-warning: #FBBF24;
    --color-warning-soft: #2D1F05;
    --color-error: #F87171;
    --color-error-soft: #3B0D0D;
    --color-backdrop: rgb(0 0 0 / 0.6);
    color-scheme: dark;
  }

  /* Type scale: size / line height */
  .text-xs { font-size: 12px; line-height: 18px; }
  .text-sm { font-size: 14px; line-height: 22px; }
  .text-base { font-size: 16px; line-height: 26px; }
  .text-lg { font-size: 18px; line-height: 28px; }
  .text-xl { font-size: 20px; line-height: 30px; }
  .text-2xl { font-size: 24px; line-height: 34px; }
  .text-3xl { font-size: 30px; line-height: 40px; }
  .text-4xl { font-size: 36px; line-height: 48px; }

  *, *::before, *::after { box-sizing: border-box; }
  html { font-family: var(--font-fa); }
  html:lang(en) { font-family: var(--font-en); }
  body {
    margin: 0; min-height: 100vh;
    background: var(--color-bg); color: var(--color-text);
    font-size: 16px; line-height: 26px;
  }
  h1, h2, h3, p { margin: 0; }
  h1, h2, h3 { font-weight: 700; }
  .muted { color: var(--color-text-muted); }
  .num { font-variant-numeric: tabular-nums; }
  .stack { display: flex; flex-direction: column; }
  .row { display: flex; align-items: center; flex-wrap: wrap; }
  .gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-5 { gap: 20px; } .gap-8 { gap: 32px; }
  svg.icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  [dir="rtl"] .icon-dir { transform: scaleX(-1); } /* directional icons mirror in RTL */
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* Focus: 2px primary ring, 2px offset (forced with .is-focus to show the state) */
  :focus-visible, .is-focus { outline: 2px solid var(--color-primary); outline-offset: 2px; }
  :focus:not(:focus-visible) { outline: none; }

  /* ---- Prototype chrome (not part of the design) ---- */
  .proto-bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
    padding: 8px 16px; font: 13px/20px "Inter", system-ui, sans-serif;
    background: repeating-linear-gradient(-45deg, #FEF3C7 0 10px, #FDE68A 10px 20px); color: #422006;
    direction: ltr;
  }
  .proto-bar a { color: #422006; font-weight: 700; }
  .proto-bar a[aria-current="page"] { text-decoration: none; background: #422006; color: #FEF3C7; padding: 0 6px; border-radius: 4px; }

  /* ---- Buttons ---- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 44px; padding: 10px 16px; border-radius: var(--radius-md);
    font: inherit; font-weight: 700; border: 1px solid transparent; cursor: pointer; text-decoration: none; white-space: nowrap;
    transition: background-color .15s, color .15s, border-color .15s;
  }
  .btn-sm { min-height: 36px; padding: 6px 12px; font-size: 14px; line-height: 22px; }
  .btn-primary { background: var(--color-primary); color: var(--color-on-primary); }
  .btn-primary:hover, .btn-primary.is-hover { background: var(--color-primary-hover); }
  .btn-secondary { background: var(--color-surface-muted); color: var(--color-text); border-color: var(--color-border); }
  .btn-secondary:hover, .btn-secondary.is-hover { border-color: var(--color-border-strong); }
  .btn-outline { background: transparent; color: var(--color-text); border-color: var(--color-border-strong); }
  .btn-outline:hover, .btn-outline.is-hover { background: var(--color-surface-muted); }
  .btn-danger { background: transparent; color: var(--color-error); border-color: var(--color-error); }
  .btn-danger:hover, .btn-danger.is-hover { background: var(--color-error-soft); }
  .btn-danger-solid { background: var(--color-error); color: var(--color-surface); }
  .btn-ghost { background: transparent; color: var(--color-primary); }
  .btn-ghost:hover, .btn-ghost.is-hover { background: var(--color-primary-soft); }
  .btn-icon { width: 44px; padding: 0; color: var(--color-text-muted); background: transparent; }
  .btn-icon:hover { background: var(--color-surface-muted); color: var(--color-text); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-inline-end-color: transparent; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- Badges ---- */
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: var(--radius-sm); font-size: 12px; line-height: 18px; font-weight: 500; white-space: nowrap; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge-primary { background: var(--color-primary-soft); color: var(--color-primary); }
  .badge-success { background: var(--color-success-soft); color: var(--color-success); }
  .badge-warning { background: var(--color-warning-soft); color: var(--color-warning); }
  .badge-error { background: var(--color-error-soft); color: var(--color-error); }
  .badge-neutral { background: var(--color-surface-muted); color: var(--color-text-muted); }

  /* ---- Cards ---- */
  .card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 16px; }
  @media (min-width: 768px) { .card { padding: 24px; } }
  .card-title { font-size: 18px; line-height: 28px; font-weight: 700; }

  /* ---- Form fields ---- */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .label { font-size: 14px; line-height: 22px; font-weight: 500; }
  .label .req { color: var(--color-error); margin-inline-start: 2px; }
  .input, .select, .textarea {
    width: 100%; min-height: 44px; padding: 10px 16px; font: inherit; color: var(--color-text);
    background: var(--color-surface); border: 1px solid var(--color-border-strong); border-radius: var(--radius-md);
    transition: border-color .15s, box-shadow .15s;
  }
  .input::placeholder, .textarea::placeholder { color: var(--color-text-muted); }
  .input:hover, .select:hover, .textarea:hover { border-color: var(--color-text-muted); }
  .input:focus-visible, .select:focus-visible, .textarea:focus-visible, .input.is-focus {
    outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 2px var(--color-primary);
  }
  .input[aria-invalid="true"], .textarea[aria-invalid="true"] { border-color: var(--color-error); }
  .input[aria-invalid="true"]:focus-visible { box-shadow: 0 0 0 2px var(--color-error); }
  .input:disabled { background: var(--color-surface-muted); color: var(--color-text-muted); cursor: not-allowed; }
  .textarea { min-height: 112px; resize: vertical; }
  .help { font-size: 14px; line-height: 22px; color: var(--color-text-muted); }
  .error-msg { font-size: 14px; line-height: 22px; color: var(--color-error); display: flex; gap: 6px; align-items: center; }
  .error-msg svg.icon { width: 16px; height: 16px; }
  .check { display: inline-flex; gap: 10px; align-items: center; min-height: 44px; cursor: pointer; }
  .check input { width: 20px; height: 20px; accent-color: var(--color-primary); margin: 0; }

  /* ---- Layout: sidebar + content (drawer below 768px) ---- */
  .shell { display: grid; grid-template-columns: 256px 1fr; min-height: calc(100vh - 36px); }
  .sidebar {
    background: var(--color-surface); border-inline-end: 1px solid var(--color-border);
    padding: 20px 12px; display: flex; flex-direction: column; gap: 4px;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 12px 20px; font-weight: 700; font-size: 20px; line-height: 30px; }
  .brand-mark { width: 32px; height: 32px; border-radius: var(--radius-md); background: var(--color-primary); color: var(--color-on-primary); display: grid; place-items: center; font-family: "Inter", sans-serif; font-size: 16px; }
  .nav-link {
    display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: var(--radius-md);
    color: var(--color-text-muted); text-decoration: none; font-weight: 500;
  }
  .nav-link:hover { background: var(--color-surface-muted); color: var(--color-text); }
  .nav-link[aria-current="page"] { background: var(--color-primary-soft); color: var(--color-primary); }
  .topbar {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 68px;
    background: var(--color-surface); border-bottom: 1px solid var(--color-border);
  }
  .topbar .spacer { flex: 1; }
  .avatar { width: 36px; height: 36px; border-radius: var(--radius-full); background: var(--color-primary-soft); color: var(--color-primary); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .main { min-width: 0; }
  .content { padding: 24px 16px 64px; display: flex; flex-direction: column; gap: 32px; max-width: 1200px; }
  @media (min-width: 1024px) { .content { padding-inline: 32px; } }
  .menu-btn { display: none; }
  .drawer-backdrop { display: none; }
  @media (max-width: 767px) {
    .shell { grid-template-columns: 1fr; }
    .sidebar { position: fixed; inset-block: 0; inset-inline-start: 0; width: 280px; z-index: 40; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 10px 30px rgb(0 0 0 / .2); }
    [dir="rtl"] .sidebar { transform: translateX(100%); }
    .shell.drawer-open .sidebar { transform: none; }
    .shell.drawer-open .drawer-backdrop { display: block; position: fixed; inset: 0; background: var(--color-backdrop); z-index: 30; }
    .menu-btn { display: inline-flex; }
  }

  .section-head { display: flex; flex-direction: column; gap: 4px; }
  .grid-2 { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
  .grid-3 { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
  .stat { display: flex; gap: 16px; align-items: center; }
  .stat-icon { width: 48px; height: 48px; border-radius: var(--radius-md); display: grid; place-items: center; }
  .stat-value { font-size: 30px; line-height: 40px; font-weight: 700; }

  /* ---- Table (scrolls on mobile) ---- */
  .table-wrap { overflow-x: auto; border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-surface); }
  table { width: 100%; border-collapse: collapse; min-width: 720px; font-size: 14px; line-height: 22px; }
  th { text-align: start; font-weight: 500; color: var(--color-text-muted); background: var(--color-surface-muted); padding: 12px 16px; white-space: nowrap; }
  td.num { white-space: nowrap; }
  td .row { flex-wrap: nowrap; }
  td { padding: 14px 16px; border-top: 1px solid var(--color-border); vertical-align: middle; }
  tbody tr:hover { background: var(--color-surface-muted); }

  /* ---- Reference pages: 404 / not access ---- */
  .ref-page {
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 20px;
    padding: 48px 16px; min-height: 420px;
  }
  .ref-page.full { min-height: calc(100vh - 36px); position: relative; }
  .ref-code { font-family: "Inter", "Vazirmatn", sans-serif; font-size: 72px; line-height: 80px; font-weight: 700; color: var(--color-primary); letter-spacing: -0.02em; }
  :lang(fa) .ref-code { font-family: "Vazirmatn", sans-serif; letter-spacing: 0; }
  .ref-icon { width: 72px; height: 72px; border-radius: var(--radius-full); background: var(--color-error-soft); color: var(--color-error); display: grid; place-items: center; }
  .ref-icon svg.icon { width: 32px; height: 32px; }
  .ref-page p { max-width: 420px; }

  /* ---- List states ---- */
  .empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 32px 16px; }
  .empty-icon { width: 56px; height: 56px; border-radius: var(--radius-full); background: var(--color-surface-muted); color: var(--color-text-muted); display: grid; place-items: center; }
  .skeleton { background: var(--color-surface-muted); border-radius: var(--radius-sm); height: 14px; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .5; } }
  .alert { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: var(--radius-md); border: 1px solid currentColor; }
  .alert-error { background: var(--color-error-soft); color: var(--color-error); }
  .alert-success { background: var(--color-success-soft); color: var(--color-success); }
  .alert p { color: var(--color-text); }

  /* ---- Toast & modal ---- */
  .toast { display: inline-flex; gap: 10px; align-items: center; padding: 12px 16px; border-radius: var(--radius-md); background: var(--color-surface); border: 1px solid var(--color-border); box-shadow: 0 10px 30px rgb(15 23 42 / .12); }
  dialog { border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-surface); color: var(--color-text); padding: 0; width: min(92vw, 440px); box-shadow: 0 20px 50px rgb(0 0 0 / .25); }
  dialog::backdrop { background: var(--color-backdrop); }
  .dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 24px; border-bottom: 1px solid var(--color-border); }
  .dialog-body { padding: 24px; }
  .dialog-foot { display: flex; justify-content: flex-end; gap: 12px; padding: 0 24px 24px; }

  /* ---- Token swatches ---- */
  .swatches { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); }
  .swatch { border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; background: var(--color-surface); }
  .swatch-color { height: 56px; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .swatch-meta { padding: 8px 12px; font-size: 12px; line-height: 18px; direction: ltr; text-align: start; font-family: "Inter", monospace; }
  .pass { color: var(--color-success); font-weight: 700; }
  .fail { color: var(--color-error); font-weight: 700; }
  .radius-demo { width: 72px; height: 48px; background: var(--color-primary-soft); border: 2px solid var(--color-primary); }
  .space-bar { height: 12px; background: var(--color-primary); border-radius: 2px; }

  /* ---- All-four view ---- */
  .matrix { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 640px), 1fr)); gap: 16px; padding: 16px; }
  .matrix figure { margin: 0; }
  .matrix figcaption { font: 700 13px/20px "Inter", sans-serif; padding-bottom: 6px; direction: ltr; text-align: left; }
  .matrix iframe { width: 100%; height: 820px; border: 1px solid var(--color-border-strong); border-radius: 8px; background: #fff; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>

<template id="tpl-kit">
  <div class="shell" id="shell">

    toastOk: ["پروژه با موفقیت ایجاد شد", "Project created"], toastErr: ["خطا در ارتباط با سرور", "Couldn't reach the server"],
    openModal: ["باز کردن مودال", "Open modal"],
    "m.title": ["حذف پروژه", "Delete project"],
    "m.body": ["آیا از حذف «طراحی فروشگاه اینترنتی پوشاک» مطمئن هستید؟ درخواست‌های آن هم حذف می‌شوند.", "Delete “Clothing online store design”? Its proposals are deleted too."],
    "m.confirm": ["حذف", "Delete"],
    "s.list": ["حالت‌های لیست", "List states"],
    "ls.loading": ["در حال بارگذاری", "Loading"], "ls.empty": ["هنوز پروژه‌ای ندارید", "No projects yet"],
    "ls.emptyBody": ["اولین پروژه‌تان را بسازید تا فریلنسرها درخواست بفرستند.", "Create your first project so freelancers can send proposals."],
    "ls.error": ["بارگذاری پروژه‌ها انجام نشد", "Couldn't load projects"], "ls.errorBody": ["اتصال را بررسی کنید و دوباره تلاش کنید.", "Check your connection and try again."],
    retry: ["تلاش دوباره", "Try again"],
    "s.tokens": ["رنگ‌ها و کنتراست", "Colors and contrast"],
    "s.tokensHint": ["نسبت‌ها همین‌جا از رنگ‌های پوسته فعال محاسبه می‌شوند (متن ≥ ۴٫۵، حاشیه ≥ ۳).", "Ratios are computed here from the active theme's colors (text ≥ 4.5, borders ≥ 3)."],
    "s.type": ["مقیاس تایپوگرافی", "Type scale"], "s.radius": ["گردی گوشه‌ها", "Radius"], "s.spacing": ["فاصله‌ها", "Spacing"],
    typeSample: ["پروژه‌ات را ثبت کن، بهترین فریلنسر را پیدا کن", "Post your project, find the right freelancer"],
    "sp.fields": ["بین فیلدها", "between fields"], "sp.cards": ["داخل کارت", "inside cards"], "sp.sections": ["بین بخش‌ها", "between sections"], "sp.touch": ["حداقل اندازه لمسی", "min touch target"],
  };

  // Token pairs checked live: [token, background, minimum ratio]
  const PAIRS = [
    ["text", "bg", 4.5], ["text-muted", "surface", 4.5], ["text-muted", "surface-muted", 4.5],
    ["on-primary", "primary", 4.5], ["on-primary", "primary-hover", 4.5], ["primary", "surface", 4.5],
    ["primary", "primary-soft", 4.5], ["success", "success-soft", 4.5], ["warning", "warning-soft", 4.5],
    ["error", "error-soft", 4.5], ["border-strong", "surface", 3], ["border-strong", "surface-muted", 3],
  ];

  const isEn = () => root.lang === "en";
  const page = params.get("page") || "";
  const view = params.get("view");

  function url(changes) {
    const p = new URLSearchParams(location.search);
    for (const [k, v] of Object.entries(changes)) v ? p.set(k, v) : p.delete(k);
    return "?" + p.toString();
  }

  function translate(scope) {
    const i = isEn() ? 1 : 0;
    scope.querySelectorAll("[data-t]").forEach(el => { el.textContent = T[el.dataset.t]?.[i] ?? el.dataset.t; });
    scope.querySelectorAll("[data-tp]").forEach(el => { el.placeholder = T[el.dataset.tp][i]; });
    scope.querySelectorAll("[data-tv]").forEach(el => { el.value = T[el.dataset.tv][i]; });
    scope.querySelectorAll("[data-ta]").forEach(el => { el.setAttribute("aria-label", T[el.dataset.ta][i]); });
  }

  function lum(h) {
    return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255)
      .map(v => v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4)
      .reduce((s, v, i) => s + v * [0.2126, 0.7152, 0.0722][i], 0);
  }
  const ratio = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((m, n) => n - m); return (x + 0.05) / (y + 0.05); };

  function renderSwatches() {
    const box = document.getElementById("swatches");
    if (!box) return;
    const css = getComputedStyle(root);
    const val = t => css.getPropertyValue("--color-" + t).trim().toUpperCase();
    box.innerHTML = PAIRS.map(([fg, bg, min]) => {
      const r = ratio(val(fg), val(bg));
      const border = min === 3;
      return `<div class="swatch">
        <div class="swatch-color" style="background:var(--color-${bg});color:var(--color-${border ? "text" : fg});${border ? `box-shadow:inset 0 0 0 3px var(--color-${fg})` : ""}">Aa · آب</div>
        <div class="swatch-meta"><div><b>${fg}</b> on ${bg}</div>
        <div>${val(fg)} / ${val(bg)}</div>
        <div class="${r >= min ? "pass" : "fail"}">${r.toFixed(2)}:1 ${r >= min ? "✓" : "✗"} (≥ ${min})</div></div></div>`;
    }).join("");
  }

  function renderTypeScale() {
    const box = document.getElementById("typescale");
    if (!box) return;
    const sizes = [["xs", "12/18"], ["sm", "14/22"], ["base", "16/26"], ["lg", "18/28"], ["xl", "20/30"], ["2xl", "24/34"], ["3xl", "30/40"], ["4xl", "36/48"]];
    box.innerHTML = sizes.map(([n, s]) =>
      `<div class="row gap-3" style="flex-wrap:nowrap;align-items:baseline"><span class="text-xs muted" style="width:88px;flex:none;direction:ltr;text-align:start">${n} · ${s}</span><span class="text-${n}" style="font-weight:${["xl", "2xl", "3xl", "4xl"].includes(n) ? 700 : 400};white-space:nowrap;overflow:hidden;text-overflow:ellipsis" data-t="typeSample"></span></div>`
    ).join("");
  }

  function syncThemeIcon() {
    document.querySelectorAll("[data-theme-icon]").forEach(u => u.setAttribute("href", root.classList.contains("dark-mode") ? "#i-sun" : "#i-moon"));
  }

  function render() {
    const app = document.getElementById("app");
    document.querySelectorAll(".proto-bar a").forEach(a => {
      const href = a.dataset.view ? url({ view: "all" }) : url({ page: a.dataset.page, view: null });
      a.href = href;
      const current = a.dataset.view ? view === "all" : view !== "all" && a.dataset.page === page;
      current ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current");
    });

    if (view === "all") {
      const base = url({ view: null, theme: null, lang: null });
      const sep = base === "?" ? "" : "&";
      app.innerHTML = `<div class="matrix">${[["fa", "light"], ["fa", "dark"], ["en", "light"], ["en", "dark"]].map(([l, t]) =>
        `<figure><figcaption>${l === "fa" ? "Persian · RTL" : "English · LTR"} · ${t}</figcaption><iframe title="${l} ${t}" src="${base}${sep}lang=${l}&theme=${t}"></iframe></figure>`).join("")}</div>`;
      return;
    }

    if (page === "404" || page === "access") {
      app.replaceChildren(document.getElementById(page === "404" ? "tpl-404" : "tpl-access").content.cloneNode(true));
      app.firstElementChild.classList.add("full");
      // full-page view gets its own language/theme buttons, like the public header
      app.firstElementChild.insertAdjacentHTML("afterbegin",
        `<div class="row gap-2" style="position:absolute;inset-block-start:16px;inset-inline-end:16px">
          <button class="btn btn-secondary btn-sm" type="button" data-toggle-lang><svg class="icon"><use href="#i-globe"/></svg><span data-t="otherLang"></span></button>
          <button class="btn btn-icon" type="button" data-toggle-theme data-ta="theme"><svg class="icon"><use href="#i-moon" data-theme-icon/></svg></button></div>`);
    } else {
      app.replaceChildren(document.getElementById("tpl-kit").content.cloneNode(true));
      app.querySelector('[data-slot="404"]').append(document.getElementById("tpl-404").content.cloneNode(true));
      app.querySelector('[data-slot="access"]').append(document.getElementById("tpl-access").content.cloneNode(true));
      app.querySelectorAll("[data-slot] h1").forEach(h => h.outerHTML = h.outerHTML.replace(/^<h1/, "<h3").replace(/h1>$/, "h3>"));
      renderTypeScale();
    }
    translate(document);
    renderSwatches();
    syncThemeIcon();
  }

  document.addEventListener("click", e => {
    const el = e.target.closest("[data-toggle-lang],[data-toggle-theme],[data-open-modal],[data-close-modal],[data-open-drawer],[data-close-drawer]");
    if (!el) return;
    if (el.matches("[data-toggle-lang]")) {
      const en = !isEn();
      root.lang = en ? "en" : "fa"; root.dir = en ? "ltr" : "rtl";
      history.replaceState(null, "", url({ lang: en ? "en" : null }));
      translate(document); renderSwatches();
    } else if (el.matches("[data-toggle-theme]")) {
      const dark = root.classList.toggle("dark-mode");
      history.replaceState(null, "", url({ theme: dark ? "dark" : null }));
      renderSwatches(); syncThemeIcon();
    } else if (el.matches("[data-open-modal]")) {
      document.getElementById("confirm").showModal(); // native dialog: traps focus, closes on Escape, restores focus
    } else if (el.matches("[data-close-modal]")) {
      document.getElementById("confirm").close();
    } else if (el.matches("[data-open-drawer]")) {
      document.getElementById("shell").classList.add("drawer-open");
      document.querySelector("#sidebar .nav-link").focus();
    } else {
      document.getElementById("shell").classList.remove("drawer-open");
    }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") document.getElementById("shell")?.classList.remove("drawer-open");
  });

  render();
</script>
</body>
</html>
